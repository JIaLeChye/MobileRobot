name: Auto Increment Version

on:
  push:
    branches: [ master, main ]

jobs:
  auto-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Increment Version
      run: |
        set -e
        
        # Check if the commit message contains the keyword "Update"
        COMMIT_MESSAGE=$(git log -1 --pretty=%B)
        if [[ ! "$COMMIT_MESSAGE" =~ [Uu]pdate ]]; then
          echo "No 'Update' keyword found in commit message. Skipping version increment."
          exit 0
        fi
        
        # Skip if this commit was made by the bot
        COMMIT_AUTHOR=$(git log -1 --pretty=%an)
        if [[ "$COMMIT_AUTHOR" == *"Bot"* ]] || [[ "$COMMIT_AUTHOR" == *"bot"* ]]; then
          echo "Commit made by bot, skipping version increment to prevent loop."
          exit 0
        fi
        
        # Read current version from version.py
        CUR_VERSION=$(grep '__version__ = ' version.py | sed 's/__version__ = "\(.*\)"/\1/')
        echo "Current version: $CUR_VERSION"
        
        # Determine what changed to decide version bump
        CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD)
        NUM_FILES=$(echo "$CHANGED_FILES" | grep -c "^" || true)
        
        # Check if any brand new folders were introduced (heuristic: check for tree changes)
        # We can also just count directories affected. We'll use >1 directory as a "folder" change.
        NUM_FOLDERS=$(echo "$CHANGED_FILES" | grep '/' | awk -F/ '{print $1}' | sort -u | wc -l)
        
        echo "Files changed: $NUM_FILES"
        echo "Top-level folders affected: $NUM_FOLDERS"
        
        IFS='.' read -r major minor patch <<< "$CUR_VERSION"
        
        if [ "$NUM_FILES" -ge 8 ] || [ "$NUM_FOLDERS" -ge 2 ]; then
          echo "Major update: $NUM_FILES files and $NUM_FOLDERS folders changed."
          major=$((major + 1))
          minor=0
          patch=0
        elif [ "$NUM_FILES" -ge 4 ]; then
          echo "Minor update: $NUM_FILES files changed."
          minor=$((minor + 1))
          patch=0
        else
          echo "Patch update: $NUM_FILES files changed."
          patch=$((patch + 1))
        fi
        
        NEW_VERSION="${major}.${minor}.${patch}"
        echo "New version: $NEW_VERSION"
        
        # Update version.py
        sed -i "s/__version__ = \"$CUR_VERSION\"/__version__ = \"$NEW_VERSION\"/" version.py
        
        # Update README badge
        README_VERSION=$(grep -o 'version-[0-9]\+\.[0-9]\+\.[0-9]\+-blue' README.md | head -1 | sed 's/version-\(.*\)-blue/\1/')
        if [ -n "$README_VERSION" ]; then
          sed -i "s/version-$README_VERSION-blue/version-$NEW_VERSION-blue/" README.md
        fi
        
        # Configure Git
        git config --global user.email "action@github.com"
        git config --global user.name "Version Bot"
        git config --global pull.rebase false
        
        # Commit and push
        git add version.py README.md
        
        if ! git diff --cached --quiet; then
          git commit -m "🔖 Auto-increment version to v$NEW_VERSION [skip ci]"
          
          for i in {1..3}; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ Successfully pushed version update v$NEW_VERSION"
              break
            else
              echo "❌ Push attempt $i failed, retrying..."
              git fetch origin ${{ github.ref_name }}
              git pull origin ${{ github.ref_name }}
              sleep 2
            fi
          done
        else
          echo "No files needed updating."
        fi
